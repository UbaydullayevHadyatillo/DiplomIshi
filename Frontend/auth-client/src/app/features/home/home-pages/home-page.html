<div class="home-wrapper">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="top-bar">
    <button class="login-btn" (click)="goToLogin()">
      <span>Kirish</span>
      <i class="pi pi-arrow-right"></i>
    </button>
  </div>

  <main class="hero">
    <div class="badge animate-fade-up" style="animation-delay: 0.1s">
      <i class="pi pi-verified"></i>
      Imtihon platformasi
    </div>

    <h1 class="hero-title animate-fade-up" style="animation-delay: 0.25s">
      <span class="line-1">O'z bilimlaringizni</span>
      <span class="line-2">biz bilan sinab<span class="accent"> ko'ring</span></span>
    </h1>

    <p class="hero-sub animate-fade-up" style="animation-delay: 0.45s">
      Onlayn testlar orqali o'z darajangizni aniqlang. Real vaqt rejimida natijalarni ko'ring.
    </p>

    <div class="hero-actions animate-fade-up" style="animation-delay: 0.6s">
      <button class="cta-primary" (click)="goToLogin()">
        <i class="pi pi-play-circle"></i>
        Boshlash
      </button>
    </div>

    <div class="stats-row animate-fade-up" style="animation-delay: 0.8s">
      <div class="stat">
        <span class="stat-num">500+</span>
        <span class="stat-label">Savollar</span>
      </div>
      <div class="divider"></div>
      <div class="stat">
        <span class="stat-num">20+</span>
        <span class="stat-label">Fanlar</span>
      </div>
      <div class="divider"></div>
      <div class="stat">
        <span class="stat-num">100%</span>
        <span class="stat-label">Ishonchli</span>
      </div>
    </div>
  </main>
</div>
